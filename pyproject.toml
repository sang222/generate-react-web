[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-team"
version = "0.1.1"
description = "Local-first AI Dev Team with Ollama and MongoDB"
requires-python = ">=3.11"
dependencies = [
  "ollama>=0.4.0",
  "pymongo>=4.8.0",
  "openai>=1.0.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0.1",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
